name: Build and publish Godot web game

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install Godot 4.3 and web export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Import and validate Godot project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --import --quit
      - name: Export browser build
        run: |
          mkdir -p web-build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path godot --export-release Web ../web-build/index.html
          touch web-build/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Godot game
        id: deployment
        uses: actions/deploy-pages@v4
