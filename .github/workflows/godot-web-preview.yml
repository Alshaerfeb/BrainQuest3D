name: Build Godot Web Preview
on:
  push:
    branches: [godot-3d-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz 'templates/web_nothreads_*.zip' -d /tmp/godot-templates
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cp /tmp/godot-templates/templates/web_nothreads_*.zip /github/home/.local/share/godot/export_templates/4.3.stable/
          ls -lh /github/home/.local/share/godot/export_templates/4.3.stable/
      - name: Import Godot resources
        run: godot --headless --path . --editor --quit
      - name: Export web preview
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Upload playable preview files
        uses: actions/upload-artifact@v4
        with:
          name: brainquest-godot-web-preview
          path: build/web/
